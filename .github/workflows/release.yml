# Builds the installers. A pushed `v*` tag also creates a draft GitHub release with them;
# a manual run only uploads them as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            config: src-tauri/tauri.bundle.conf.json
          - os: macos-latest
            target: aarch64-apple-darwin
            config: src-tauri/tauri.bundle.macos.conf.json
          - os: macos-latest
            target: x86_64-apple-darwin
            config: src-tauri/tauri.bundle.macos.conf.json
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi

      - name: Install npm packages
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run tauri build -- --config ${{ matrix.config }} --target ${{ matrix.target }}

      - name: Collect installers
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bundle="target/$TARGET/release/bundle"
          mkdir -p out
          case "$TARGET" in
            *windows*)
              cp "$bundle"/nsis/*-setup.exe out/
              ;;
            *apple*)
              arch=$([[ "$TARGET" == aarch64-* ]] && echo aarch64 || echo x64)
              cp "$bundle"/dmg/*.dmg out/
              tar -czf "out/Herald_${VERSION}_${arch}.app.tar.gz" -C "$bundle/macos" Herald.app
              ;;
          esac
          cd out
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
          done
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herald-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "Herald ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes
